<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>CeleMod</title>
  </head>
  <body>
    <div class="dummy"></div>
    <span class="celemod-version" title="点击检查更新 / Check Update">
      <div class="caption-hash"></div>
      <div class="caption-version"></div>
    </span>
    <div class="window-caption" data-tauri-drag-region>CeleMod</div>
    <span class="win-ctrl">
      <button id="window-minimize" aria-label="Minimize">&minus;</button>
      <button id="window-maximize" aria-label="Maximize">&#9633;</button>
      <button id="window-close" class="close" aria-label="Close">&times;</button>
    </span>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
