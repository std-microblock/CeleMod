<!DOCTYPE html>
<html
  lang="en"
  window-alignment="5"
  window-corners="round"
  window-maximizable="true"
  window-min-width="800px"
  window-min-height="600px"
  window-icon="./src/resources/Celemod.png"
>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>CeleMod</title>
    <script>/* @sciter-runtime */</script>
  </head>
  <body>
    <div class="dummy"></div>
    <span class="celemod-version" title="点击检查更新 / Check Update">
      <div class="caption-hash"></div>
      <div class="caption-version"></div>
    </span>
    <div role="window-caption">CeleMod</div>
    <span class="win-ctrl">
      <button role="window-minimize"><icon|minus /></button>
      <button role="window-maximize"><icon|landscape /></button>
      <button class="close" role="window-close"><icon|cancel /></button>
    </span>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
