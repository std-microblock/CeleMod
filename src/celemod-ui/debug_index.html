<!DOCTYPE html>
<html

  window-alignment="5"

  window-maximizable="true"
  window-min-width="800px"
  window-min-height="600px"
>
  <head>
    <meta charset="UTF-8" />
    <title>CeleMod</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;

      }, 10);
