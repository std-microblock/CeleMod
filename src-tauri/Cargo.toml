[package]
name = "cele-mod"
version = "1.1.3"
edition = "2024"

[lib]
name = "cele_mod_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "cele-mod"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-http = "2"
tauri-plugin-dialog = "2"
tauri-plugin-system-symbols = "0.3"
tauri-plugin-window-controls = "0.1"
game-scanner = { git = "https://github.com/EqualGames/game-scanner", branch = "dependabot/cargo/sysinfo-0.28.2" }
lazy_static = "1"
anyhow = "1"
zip = "4"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9.25"
serde_json = "1"
ureq = { version = "2", features = ["json", "gzip", "tls"] }
strip_bom = "1"
open = "5"
dirs = "6"
hostname = "0.4"
sysinfo = "0.28.4"
aes = "0.8"
base64 = "0.22"
cbc = "0.1"
pbkdf2 = "0.12"
rand = "0.8"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.10"
url = "2"
webpki-roots = "1"
whoami = "1"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["wincon", "consoleapi", "libloaderapi", "winuser"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
window-vibrancy = "0.8"
